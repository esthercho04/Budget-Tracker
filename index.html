<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<title>Budget Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #ffffff;
    --bg2: #f7f7f5;
    --bg3: #f0ede8;
    --text: #1a1a1a;
    --text2: #6b6b6b;
    --text3: #aaaaaa;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --danger: #c0392b;
    --dangerbg: #fdf0ef;
    --accent: #1a1a1a;
    --radius: 10px;
    --radius-sm: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --bg2: #2c2c2e;
      --bg3: #3a3a3c;
      --text: #f2f2f7;
      --text2: #aeaeb2;
      --text3: #636366;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.18);
      --danger: #ff6b6b;
      --dangerbg: rgba(255,107,107,0.12);
      --accent: #f2f2f7;
    }
  }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); }
  .app { display: flex; height: 100vh; height: 100dvh; max-width: 900px; margin: 0 auto; background: var(--bg); }
  .sidebar { width: 200px; background: var(--bg2); border-right: 0.5px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 20px 16px 12px; border-bottom: 0.5px solid var(--border); }
  .sidebar-header h1 { font-size: 17px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .sidebar-header h1 i { font-size: 18px; }
  .sidebar-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .month-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .month-item { padding: 9px 10px 9px 14px; display: flex; align-items: center; justify-content: space-between; gap: 6px; cursor: pointer; transition: background 0.1s; }
  .month-item:hover { background: var(--bg3); }
  .month-item.active { background: var(--bg); }
  .month-info { flex: 1; min-width: 0; }
  .month-name { font-size: 13px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .month-item.active .month-name { color: var(--text); font-weight: 500; }
  .month-amt { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .month-item.active .month-amt { color: var(--text2); }
  .month-del { background: none; border: none; cursor: pointer; color: transparent; padding: 4px; font-size: 15px; line-height: 1; border-radius: var(--radius-sm); flex-shrink: 0; transition: color 0.1s, background 0.1s; }
  .month-item:hover .month-del { color: var(--text3); }
  .month-del:hover { color: var(--danger) !important; background: var(--dangerbg); }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .main-header { padding: 16px 18px 14px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .main-title { font-size: 17px; font-weight: 600; color: var(--text); }
  .clear-btn { font-size: 13px; color: var(--text3); background: none; border: none; cursor: pointer; font-family: inherit; padding: 0; }
  .clear-btn:hover { color: var(--danger); }
  .table-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 500; color: var(--text3); border-bottom: 0.5px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 1; text-transform: uppercase; letter-spacing: 0.4px; }
  td { padding: 11px 16px; border-bottom: 0.5px solid var(--border); color: var(--text); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .date-cell { width: 100px; color: var(--text2); font-size: 12px; white-space: nowrap; }
  .val-cell { width: 110px; }
  .act-cell { width: 40px; }
  input[type=text], input[type=number] { width: 100%; border: none; background: transparent; font-size: 14px; color: var(--text); outline: none; font-family: inherit; }
  input::placeholder { color: var(--text3); }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .row-del { background: none; border: none; cursor: pointer; color: var(--text3); padding: 0; font-size: 16px; line-height: 1; }
  .row-del:hover { color: var(--danger); }
  .empty-state { padding: 48px 20px; text-align: center; color: var(--text3); font-size: 14px; line-height: 1.6; }
  .empty-state i { font-size: 32px; display: block; margin-bottom: 10px; color: var(--text3); }
  .footer { border-top: 0.5px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: var(--bg2); }
  .add-btn { background: none; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--text2); font-family: inherit; display: flex; align-items: center; gap: 5px; }
  .add-btn:hover { background: var(--bg3); }
  .add-btn i { font-size: 14px; }
  .total-block { text-align: right; }
  .total-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.4px; }
  .total-val { font-size: 20px; font-weight: 600; color: var(--text); margin-top: 1px; }
  @media (max-width: 600px) {
    .sidebar { width: 150px; }
    .sidebar-header h1 { font-size: 14px; }
    .month-name { font-size: 12px; }
    th, td { padding: 10px 12px; }
    .main-title { font-size: 15px; }
    .total-val { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1><i class="ti ti-wallet"></i> Budget</h1>
      <div class="sidebar-sub">Tap a month to view</div>
    </div>
    <div class="month-list" id="monthList"></div>
  </div>
  <div class="main">
    <div class="main-header">
      <span class="main-title" id="mainTitle">—</span>
      <button class="clear-btn" onclick="clearMonth()">Clear all</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="date-cell">Date</th>
            <th>Expense</th>
            <th class="val-cell">Amount</th>
            <th class="act-cell"></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyMsg" class="empty-state" style="display:none;">
        <i class="ti ti-receipt"></i>
        No expenses yet<br>tap add expense to get started
      </div>
    </div>
    <div class="footer">
      <button class="add-btn" onclick="addRow()"><i class="ti ti-plus"></i> Add expense</button>
      <div class="total-block">
        <div class="total-label">Total</div>
        <div class="total-val" id="totalVal">$0.00</div>
      </div>
    </div>
  </div>
</div>

<script>
const KEY = 'budget_v1';
let data = {};
let active = '';

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(k){
  const [y,m]=k.split('-');
  return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
}
function fmtDate(iso){
  return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}
function load(){ try{ data=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ data={}; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} }
function ensure(k){ if(!data[k]) data[k]=[]; }
function total(k){ return (data[k]||[]).reduce((s,r)=>s+(parseFloat(r.value)||0),0); }

function renderSidebar(){
  const el = document.getElementById('monthList');
  const thisMonth = monthKey(new Date());
  const keys = [...new Set([thisMonth,...Object.keys(data)])].sort().reverse();
  el.innerHTML='';
  keys.forEach(k=>{
    const d=document.createElement('div');
    d.className='month-item'+(k===active?' active':'');
    const t=total(k);
    const lbl=monthLabel(k).split(' ');
    d.innerHTML=`
      <div class="month-info" onclick="selectMonth('${k}')">
        <div class="month-name">${lbl[0]} ${lbl[1]}</div>
        <div class="month-amt">${t>0?'$'+t.toFixed(2):''}</div>
      </div>
      <button class="month-del" onclick="deleteMonth(event,'${k}')" title="Delete ${monthLabel(k)}">
        <i class="ti ti-trash"></i>
      </button>`;
    el.appendChild(d);
  });
}

function selectMonth(k){ active=k; ensure(k); renderAll(); }

function deleteMonth(e,k){
  e.stopPropagation();
  if(!confirm('Delete '+monthLabel(k)+' and all its expenses?')) return;
  delete data[k]; save();
  const rem=Object.keys(data).sort().reverse();
  active=rem.length>0?rem[0]:monthKey(new Date());
  ensure(active); renderAll();
}

function renderTable(){
  const tbody=document.getElementById('tableBody');
  const empty=document.getElementById('emptyMsg');
  const rows=data[active]||[];
  document.getElementById('mainTitle').textContent=monthLabel(active);
  document.getElementById('totalVal').textContent='$'+total(active).toFixed(2);
  if(rows.length===0){ tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  tbody.innerHTML='';
  rows.forEach((row,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td class="date-cell">${row.date?fmtDate(row.date):'<span style="color:var(--text3);font-size:11px">auto</span>'}</td>
      <td><input type="text" placeholder="e.g. Groceries" value="${(row.expense||'').replace(/"/g,'&quot;')}" oninput="upd(${i},'expense',this.value)"></td>
      <td class="val-cell"><input type="number" placeholder="0.00" value="${row.value||''}" min="0" step="0.01" inputmode="decimal" oninput="upd(${i},'value',this.value)"></td>
      <td class="act-cell"><button class="row-del" onclick="delRow(${i})"><i class="ti ti-x"></i></button></td>`;
    tbody.appendChild(tr);
  });
}

function renderAll(){ renderSidebar(); renderTable(); }

function addRow(){
  ensure(active);
  data[active].push({date:new Date().toISOString(),expense:'',value:''});
  save(); renderAll();
  setTimeout(()=>{ const el=document.querySelector('#tableBody tr:last-child input[type=text]'); if(el) el.focus(); },30);
}

function upd(i,field,val){
  if(!data[active]||!data[active][i]) return;
  data[active][i][field]=val;
  if(!data[active][i].date) data[active][i].date=new Date().toISOString();
  save();
  document.getElementById('totalVal').textContent='$'+total(active).toFixed(2);
  renderSidebar();
}

function delRow(i){
  if(!data[active]) return;
  data[active].splice(i,1); save(); renderAll();
}

function clearMonth(){
  if(!data[active]||data[active].length===0) return;
  if(confirm('Clear all entries for '+monthLabel(active)+'?')){ data[active]=[]; save(); renderAll(); }
}

load();
active=monthKey(new Date());
ensure(active);
renderAll();
</script>
</body>
</html>
